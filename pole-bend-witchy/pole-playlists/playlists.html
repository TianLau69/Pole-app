<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090809">
<link rel="icon" href="../assets/accueil.jpg">
<link rel="apple-touch-icon" href="../assets/accueil.jpg">
<link rel="manifest" href="../manifest.json">
<title>Mes playlists — Programme Pole</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{background:#090809;color:#f6eee8}.page{max-width:760px;margin:auto;padding:24px 18px 90px}
.head{display:flex;gap:12px;align-items:center;margin-bottom:20px}.back,.small,.tab{border:1px solid #34252b;background:#120d10;color:#f6eee8;border-radius:999px;padding:9px 13px;cursor:pointer}
.back{width:38px;height:38px;padding:0;border-radius:50%;font-size:20px}h1,h2,h3{font-family:Georgia,serif;font-weight:500}.sub,.meta{color:#9f8d90;font-size:12px}
.tabs{display:flex;gap:8px;margin:15px 0}.tab{flex:1}.tab.active,.primary{background:#a3133d;border-color:#a3133d;color:#fff}
.panel,.playlist{border:1px solid #34252b;border-radius:20px;background:#100d0f;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;color:#cdbfc0;margin:10px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:12px;border:1px solid #34252b;background:#090809;color:#f6eee8;font:inherit}textarea{min-height:65px}
.primary{width:100%;border-radius:999px;padding:12px;font-weight:800;cursor:pointer;margin-top:12px}.list{display:grid;gap:7px;margin-top:10px}
.pick{display:grid;grid-template-columns:25px 52px 1fr;gap:10px;align-items:center;padding:9px;border:1px solid #34252b;border-radius:14px;background:#120e11}.pick input{width:18px;padding:0;accent-color:#cf315d}
.thumb{width:52px;height:52px;border-radius:11px;overflow:hidden;background:#0b080a;display:grid;place-items:center;text-align:center;color:#6f6265;font-size:10px}.thumb img{width:100%;height:100%;object-fit:cover}.name{font-size:13px;font-weight:800}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.danger{color:#ff9aad}.empty{text-align:center;color:#817477;padding:20px}.item{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #24191e}.item:last-child{border-bottom:0}
.hidden{display:none!important}.launch{position:fixed;inset:0;background:#090809;z-index:30;display:none}.launch.show{display:block}.launchIn{max-width:650px;margin:auto;min-height:100%;padding:18px;display:flex;flex-direction:column}
.launchTop{display:flex;justify-content:space-between}.visual{height:300px;margin:18px 0;border-radius:22px;overflow:hidden;background:radial-gradient(circle,#2b0b18,#100c0f 67%);display:grid;place-items:center}.visual img{width:100%;height:100%;object-fit:cover}.placeholder{opacity:.5}
.launchTitle{text-align:center;font:500 28px Georgia,serif;margin:0}.launchMeta{text-align:center;color:#b9aaa9;margin-top:7px}.timer{text-align:center;font-size:54px;font-weight:900;margin:24px 0 12px}.launchActions{display:flex;gap:8px}.launchActions button{flex:1}.note{text-align:center;color:#9f8d90;font-size:12px;margin-top:12px}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <button class="back" onclick="location.href='../index.html'">‹</button>
    <div><h1 style="margin:0">Mes playlists</h1><div class="sub">Crée tes séances d'exercices et tes listes de figures.</div></div>
  </div>
  <div class="tabs">
    <button id="tabEx" class="tab active" onclick="setType('exercise')">🏋️ Exercices</button>
    <button id="tabFig" class="tab" onclick="setType('figure')">✦ Figures</button>
  </div>
  <div class="panel">
    <h2 style="margin-top:0">Nouvelle playlist</h2>
    <label>Nom</label><input id="name" placeholder="Ex. Prépa pole du dimanche">
    <label>Description</label><textarea id="description" placeholder="Facultatif"></textarea>
    <label>Éléments</label><div id="picker" class="list"></div>
    <button class="primary" onclick="createPlaylist()">+ Créer la playlist</button>
  </div>
  <div class="panel"><h2 style="margin-top:0">Mes playlists</h2><div id="playlists"></div></div>
  <div id="editor" class="panel hidden"><h2>Modifier</h2><label>Nom</label><input id="editName"><label>Description</label><textarea id="editDescription"></textarea><div id="editPicker" class="list"></div><div class="actions"><button class="small" onclick="saveEdit()">Enregistrer</button><button class="small" onclick="closeEdit()">Annuler</button></div></div>
</div>

<div id="launch" class="launch"><div class="launchIn">
  <div class="launchTop"><button class="small" onclick="closeLaunch()">Quitter</button><span id="count" class="sub"></span></div>
  <div id="visual" class="visual"></div><h2 id="launchTitle" class="launchTitle"></h2><div id="launchMeta" class="launchMeta"></div><div id="timer" class="timer"></div>
  <div class="launchActions"><button class="small" onclick="prevItem()">← Précédent</button><button id="mainBtn" class="primary" style="margin:0" onclick="toggleTimer()">Démarrer</button><button class="small" onclick="nextItem()">Suivant →</button></div>
  <div id="note" class="note"></div>
</div></div>

<script src="../data/programs.js"></script>
<script src="js/playlists.js"></script>
<script src="../js/navigation.js"></script>
</body>
</html>
