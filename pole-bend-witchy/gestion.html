<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion — Pole et Moi</title>

  <link rel="icon" href="assets/accueil.jpg">
  <link rel="apple-touch-icon" href="assets/accueil.jpg">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/style.css">

  <style>
    .manage-page {
      max-width: 900px;
      margin: auto;
      padding: 24px 18px 80px;
    }

    .manage-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .manage-header .headTexts h1 {
      margin: 0 0 4px;
    }

    .manage-header .headTexts p {
      margin: 0;
      color: var(--muted, #ad999f);
      font-size: 13px;
    }

    .manage-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    .manage-tabs button {
      flex: 1;
    }

    .manage-section {
      display: none;
    }

    .manage-section.active {
      display: block;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 17px;
    }

    .manage-card {
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 20px;
      border: 1px solid rgba(210, 65, 110, .3);
      background: rgba(20, 12, 17, .9);
    }

    .manage-card h2 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.15);
      background: #100b0e;
      color: #fff;
      font: inherit;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .photo-preview {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px dashed rgba(255,255,255,.25);
      display: block;
      margin-top: 10px;
      background: #0d090b;
    }

    .item-list {
      display: grid;
      gap: 10px;
    }

    .manage-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.08);
    }

    .manage-item img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 10px;
      background: #0d090b;
    }

    .manage-item-info {
      flex: 1;
    }

    .manage-item-info strong {
      display: block;
      margin-bottom: 3px;
    }

    .manage-item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Grille "image + nom" des exercices, cliquable */
    .exGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .exCard {
      display: flex;
      flex-direction: column;
      border: 1px solid #34252b;
      border-radius: 16px;
      background: #120d10;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      padding: 0;
    }

    .exCard img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #0d090b;
    }

    .exCard .exCardName {
      padding: 8px 8px 10px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .exCard.isHidden {
      opacity: .4;
    }

    .exCard .exCardBadge {
      font-size: 9px;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: #d6a08a;
      padding: 0 8px;
    }

    /* Boutons : mêmes codes que sur "Mes playlists" pour un rendu cohérent
       et lisible (fond sombre, texte clair) partout sur cette page */
    button {
      -webkit-appearance: none;
      appearance: none;
      font: inherit;
    }

    body button:not(.exCard) {
      border: 1px solid #34252b;
      background: #120d10;
      color: #f6eee8;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
    }

    body button.back {
      width: 40px;
      height: 40px;
      padding: 0 !important;
      border-radius: 50% !important;
      font-size: 19px;
      flex: 0 0 40px;
    }

    body button.round-add {
      width: 38px;
      height: 38px;
      padding: 0 !important;
      border-radius: 50% !important;
      font-size: 20px;
      line-height: 1;
      background: #a3133d !important;
      border-color: #a3133d !important;
      color: #fff !important;
    }

    .manage-tabs button.active {
      background: #a3133d;
      border-color: #a3133d;
      color: #fff;
    }

    body button.primary,
    body button[type="submit"] {
      width: 100%;
      background: linear-gradient(90deg,#a91442,#d52f63) !important;
      border-color: #a91442 !important;
      color: #fff !important;
      font-weight: 800;
      padding: 12px 14px;
    }

    body button.small-btn {
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 12.5px;
    }

    .danger {
      border-color: rgba(220,60,90,.5) !important;
      color: #ff9aad !important;
      background: transparent !important;
    }

    .star {
      color: #f0c56a;
      font-size: 20px;
      cursor: pointer;
    }

    .empty {
      opacity: .55;
      padding: 20px 0;
      text-align: center;
    }

    /* Modal d'ajout / édition d'un exercice */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.74);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
    }

    .modal.show {
      display: flex;
    }

    .sheet {
      width: min(620px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: #0d090c;
      border: 1px solid #34252b;
      border-radius: 26px 26px 0 0;
      padding: 18px;
    }

    .sheetHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .sheetHead h2 {
      margin: 0;
      font-size: 18px;
    }

    .close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #34252b;
      background: #151014;
      font-size: 20px;
      cursor: pointer;
      flex: 0 0 36px;
      padding: 0;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .modal-actions button {
      flex: 1;
      min-width: 120px;
    }
  </style>
</head>

<body>

<div class="manage-page">

  <div class="manage-header">
    <button class="back" onclick="location.href='index.html'">‹</button>
    <div class="headTexts">
      <h1>Gestion</h1>
      <p>Ajoute tes exercices et construis ta galerie de figures de pole.</p>
    </div>
  </div>


  <div class="manage-tabs">
    <button id="tabExercises" class="active" onclick="showTab('exercises')">
      🏋️ Exercices
    </button>

    <button id="tabFigures" onclick="showTab('figures')">
      ✦ Figures de pole
    </button>
  </div>


  <!-- ========================= -->
  <!-- EXERCICES -->
  <!-- ========================= -->

  <section id="exercisesSection" class="manage-section active">

    <div class="section-head">
      <h2>Tous mes exercices</h2>
      <button class="round-add" onclick="openExerciseForm(null)">+</button>
    </div>

    <p style="color:#ad999f;font-size:12.5px;margin:-6px 0 14px">
      Touche un exercice pour le modifier, changer sa photo, le masquer ou le supprimer.
    </p>

    <div id="exercisesGrid" class="exGrid"></div>

  </section>


  <!-- ========================= -->
  <!-- FIGURES DE POLE -->
  <!-- ========================= -->

  <section id="figuresSection" class="manage-section">

    <div class="manage-card">

      <h2>Ajouter une figure</h2>

      <div class="field">
        <label>Nom de la figure</label>
        <input id="figureName"
          placeholder="Ex. Gemini">
      </div>

      <div class="field">
        <label>Niveau</label>

        <select id="figureLevel">
          <option value="Débutant">Débutant</option>
          <option value="Intermédiaire">Intermédiaire</option>
          <option value="Avancé">Avancé</option>
          <option value="Expert">Expert</option>
        </select>
      </div>

      <div class="field">
        <label>Photo</label>

        <input id="figurePhoto"
          type="file"
          accept="image/jpeg,image/png,image/webp">

        <img id="figurePreview"
             class="photo-preview"
             style="display:none">
      </div>

      <button class="primary" onclick="addFigure()">
        + Ajouter la figure
      </button>

    </div>


    <div class="manage-card">

      <h2>Ma galerie de figures</h2>

      <div id="figuresList" class="item-list"></div>

    </div>

  </section>

</div>


<!-- ========================= -->
<!-- MODAL EXERCICE (ajout / édition) -->
<!-- ========================= -->

<div id="exerciseModal" class="modal">
  <div class="sheet">

    <div class="sheetHead">
      <h2 id="exerciseModalTitle">Ajouter un exercice</h2>
      <button class="close" onclick="closeExerciseModal()">×</button>
    </div>

    <div class="field">
      <label>Nom de l'exercice</label>
      <input id="exerciseName" placeholder="Ex. Traction australienne">
    </div>

    <div class="field">
      <label>Description</label>
      <textarea id="exerciseDescription"
        placeholder="Courte description de l'exercice"></textarea>
    </div>

    <div class="field" id="exerciseMusclesField">
      <label>Muscles visés</label>
      <input id="exerciseMuscles"
        placeholder="Ex. Dos · biceps · épaules">
    </div>

    <div class="field" id="exerciseProgramField">
      <label>Programme</label>
      <select id="exerciseProgram">
        <option value="renfo">Renfo</option>
        <option value="jambes">Souplesse jambes</option>
        <option value="bras">Souplesse bras</option>
      </select>
    </div>

    <div class="field">
      <label>Photo</label>
      <input id="exercisePhoto"
        type="file"
        accept="image/jpeg,image/png,image/webp">

      <img id="exercisePreview"
           class="photo-preview"
           style="display:none">
    </div>

    <div class="modal-actions">
      <button class="primary" onclick="saveExerciseForm()">
        Enregistrer
      </button>
    </div>

    <div class="modal-actions" id="exerciseModalExtraActions"></div>

  </div>
</div>


<script src="data/programs.js"></script>
<script src="js/store.js"></script>
<script src="js/gestion.js"></script>
<script src="js/navigation.js"></script>
</body>
</html>
